<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color: #f4f4f5;">
  <div style="max-width: 600px; margin: 0 auto; padding: 24px 20px;">
    <div style="background-color: #f8f9fa; padding: 24px; border-radius: 10px;">
      <h2 style="color: #333; margin: 0 0 20px 0; font-size: 20px; font-weight: 600; text-align: center;">{{TITLE}}</h2>
      <p style="color: #666; margin: 0 0 20px 0; font-size: 15px; line-height: 1.5; text-align: center;">{{INTRO}}</p>
      <div style="background-color: #2563eb; color: white; padding: 16px 24px; border-radius: 8px; font-size: 28px; font-weight: bold; letter-spacing: 8px; margin: 20px 0; text-align: center; user-select: all; -webkit-user-select: all;">{{OTP}}</div>
      <p style="color: #666; font-size: 14px; margin: 0 0 10px 0; text-align: center;">{{EXPIRY}}</p>
      <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
      <p style="color: #999; font-size: 12px; margin: 0; text-align: center;">{{FOOTER}}</p>
    </div>
  </div>
</body>
</html>
